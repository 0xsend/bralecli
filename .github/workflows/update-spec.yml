name: Update Brale Spec

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brale-spec-update
  cancel-in-progress: false

jobs:
  prepare:
    name: Check upstream spec
    if: github.repository == '0xsend/bralecli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
      hash: ${{ steps.refresh.outputs.hash }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Read previous proposal pin
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous_sha=$(timeout 30s gh api \
            "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/automation/brale-spec" \
            --jq '.[] | select(.ref == "refs/heads/automation/brale-spec") | .object.sha')
          if [ -n "$previous_sha" ]; then
            timeout 30s gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$GITHUB_REPOSITORY/contents/packages/brale/src/spec.ts?ref=$previous_sha" \
              > "$RUNNER_TEMP/previous-pin.ts"
          fi

      - name: Refresh spec and pin
        id: refresh
        shell: bash
        run: |
          set -euo pipefail
          node scripts/refresh-spec.ts --update-pin --format json \
            --previous-pin "$RUNNER_TEMP/previous-pin.ts" > "$RUNNER_TEMP/spec-refresh.json"
          changed=$(jq -er '.changed | tostring' "$RUNNER_TEMP/spec-refresh.json")
          hash=$(jq -er '.hash' "$RUNNER_TEMP/spec-refresh.json")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "Spec changed: $changed; upstream SHA-256: $hash" >> "$GITHUB_STEP_SUMMARY"
          if [ "$changed" = true ]; then
            mkdir -p "$RUNNER_TEMP/spec-update"
            cp packages/brale/openapi/brale.json "$RUNNER_TEMP/spec-update/brale.json"
            cp "$RUNNER_TEMP/spec-refresh.json" "$RUNNER_TEMP/spec-update/revision.json"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: artifact
        if: steps.refresh.outputs.changed == 'true'
        with:
          name: brale-spec-update
          path: ${{ runner.temp }}/spec-update/
          if-no-files-found: error
          retention-days: 7

  compatibility:
    name: Check proposed contract
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      checks: ${{ steps.verify.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/spec-update
      - name: Validate and apply proposed data
        run: node scripts/apply-spec-proposal.ts --proposal-dir "$RUNNER_TEMP/spec-update"
      - name: Check compatibility in isolation
        id: verify
        run: node scripts/ci-sandbox.mjs compatibility

  pull-request:
    name: Propose spec update
    needs: [prepare, compatibility]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/spec-update
      - name: Validate data and propose version from trusted source
        run: node scripts/apply-spec-proposal.ts --proposal-dir "$RUNNER_TEMP/spec-update"
      - name: Create or update draft PR
        id: proposal
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          base: main
          branch: automation/brale-spec
          add-paths: |
            packages/brale/openapi/brale.json
            packages/brale/src/spec.ts
            apps/cli/package.json
            apps/cli/CHANGELOG.md
          commit-message: 'chore(spec): refresh Brale OpenAPI contract'
          title: 'chore(spec): refresh Brale OpenAPI contract'
          draft: always-true
          maintainer-can-modify: false
          body: |
            Brale's upstream OpenAPI bytes changed. This PR updates the vendored
            document and its SHA-256/fetch-date pin. A semantic contract change
            also proposes a CLI version and changelog entry from trusted main.
            Documentation-only or formatting-only updates keep the version unchanged.
            Contract changes conservatively propose a minor release before 1.0,
            and a major release from 1.0 onward; review the diff and adjust the
            proposed version and release note when appropriate before merging.
            A merged version change enters the draft-release build workflow.

            Upstream SHA-256: `${{ needs.prepare.outputs.hash }}`

            Compatibility job: **${{ needs.compatibility.result }}**.
            Container step: **${{ needs.compatibility.outputs.checks || 'NOT RUN' }}**.
            The intended sequence is `nub run check`, `nub run build`, `nub run knip`,
            and `nub run jscpd`, stopping at the first failure. Setup, download,
            validation, or container startup failures mean checks are NOT RUN.
            Later checks after a failure are NOT RUN. Inspect the [run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for the commands actually started and their results.

            Preparation installs no project dependencies. Compatibility runs on a
            separate runner in a credential-free, offline container. The publisher
            validates the preparation artifact and reconstructs the pin, version,
            and changelog from trusted source; compatibility code cannot replace
            the proposed files. The artifact contains no package or changelog files.

            Review the contract diff, then close and reopen this draft PR as a
            maintainer to trigger pull-request CI under this repository's actor
            policy. Confirm all seven required checks appear on the current PR
            revision and pass before marking it ready, requesting approval, or
            merging. Manual **CI** dispatch remains useful for diagnostics;
            verify the required checks attached to this PR itself. Required human
            review and branch protections still apply; this bot never approves or merges.

            This branch belongs to the bot and may be replaced on the next run.
            Make compatibility fixes on a separate branch.
      - name: Report proposal
        env:
          PR_URL: ${{ steps.proposal.outputs.pull-request-url }}
          OPERATION: ${{ steps.proposal.outputs.pull-request-operation }}
        run: echo "Spec PR $OPERATION $PR_URL" >> "$GITHUB_STEP_SUMMARY"
